plugins { id 'com.android.application' }
android {
    namespace 'com.anubhab.mountaintv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.anubhab.mountaintv'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.6.2'
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
